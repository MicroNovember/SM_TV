<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLTRA Live - iOS Style</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --card-hover: #2c2c2e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --accent-color: #0a84ff;
            --live-red: #ff453a;
            --border-color: #2c2c2e;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px 0; }
        header p { color: var(--text-secondary); font-size: 14px; margin: 0 0 16px 0; }

        /* เมนูสลับหน้าจอ (Tab Switcher) */
        .tab-menu {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .match-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .match-card:hover {
            background-color: var(--card-hover);
            transform: translateY(-2px);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .league-badge {
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .live-tag {
            background-color: rgba(255, 69, 58, 0.2);
            color: var(--live-red);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--live-red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .teams-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .team-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 500;
        }

        .team-row img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .match-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .watch-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .loading, .no-data {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
            font-size: 15px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <h1>KLTRA Live Center</h1>
        <p>iOS Style Hub</p>
        
        <!-- เมนูสลับแท็บ -->
        <div class="tab-menu">
            <button class="tab-btn active" id="btn-matches" onclick="switchTab('matches')">⚽ รายการแข่งขันสด</button>
            <button class="tab-btn" id="btn-channels" onclick="switchTab('channels')">📺 ช่องรายการทีวี</button>
        </div>
    </header>

    <!-- พื้นที่แสดงผลข้อมูล -->
    <div id="content-container" class="match-grid">
        <div class="loading">กำลังโหลดข้อมูล...</div>
    </div>

    <script>
        let currentTab = 'matches';

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('btn-matches').classList.toggle('active', tab === 'matches');
            document.getElementById('btn-channels').classList.toggle('active', tab === 'channels');
            loadData();
        }

        async function loadData() {
            const container = document.getElementById('content-container');
            container.innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';

            try {
                if (currentTab === 'matches') {
                    const response = await fetch('live_events.json');
                    const events = await response.json();
                    renderMatches(events);
                } else {
                    const response = await fetch('live-channel.json');
                    const channels = await response.json();
                    renderChannels(channels);
                }
            } catch (error) {
                console.error('Error loading data:', error);
                container.innerHTML = `<div class="no-data">ไม่พบไฟล์ข้อมูล หรือเกิดข้อผิดพลาดในการโหลด (${currentTab === 'matches' ? 'live_events.json' : 'live-channel.json'})</div>`;
            }
        }

        function renderMatches(events) {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            if (!events || events.length === 0) {
                container.innerHTML = '<div class="no-data">ไม่พบรายการแข่งขันสดในขณะนี้</div>';
                return;
            }

            events.forEach(ev => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.onclick = () => {
                    if (ev.stream_url) {
                        window.open(ev.stream_url, '_blank');
                    } else {
                        alert('ไม่พบลิงก์สตรีมสำหรับรายการนี้');
                    }
                };

                card.innerHTML = `
                    <div>
                        <div class="match-header">
                            <span class="league-badge" title="${ev.league || ev.category}">${ev.league || ev.category}</span>
                            <div class="live-tag"><div class="live-dot"></div> LIVE</div>
                        </div>
                        <div class="teams-container">
                            <div class="team-row">
                                <img src="${ev.home_logo || ''}" onerror="this.style.display='none'">
                                <span>${ev.home}</span>
                            </div>
                            <div class="team-row">
                                <img src="${ev.away_logo || ''}" onerror="this.style.display='none'">
                                <span>${ev.away}</span>
                            </div>
                        </div>
                    </div>
                    <div class="match-footer">
                        <span>🕒 ${ev.time_display || ev.time_utc || ''}</span>
                        <button class="watch-btn">รับชม ▸</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderChannels(channels) {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            if (!channels || channels.length === 0) {
                container.innerHTML = '<div class="no-data">ไม่พบช่องรายการทีวีในขณะนี้</div>';
                return;
            }

            channels.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.onclick = () => {
                    if (ch.stream_url) {
                        window.open(ch.stream_url, '_blank');
                    } else {
                        alert('ไม่พบลิงก์สตรีมสำหรับช่องนี้');
                    }
                };

                card.innerHTML = `
                    <div>
                        <div class="match-header">
                            <span class="league-badge">TV CHANNEL</span>
                            <div class="live-tag" style="background-color: rgba(48, 209, 88, 0.2); color: #30d158;">
                                <div class="live-dot" style="background-color: #30d158;"></div> ${ch.status || 'ONLINE'}
                            </div>
                        </div>
                        <div class="teams-container" style="align-items: center; text-align: center; padding: 10px 0;">
                            <img src="${ch.logo || ''}" style="height: 45px; max-width: 120px; object-fit: contain; margin-bottom: 8px;" onerror="this.style.display='none'">
                            <span style="font-size: 16px; font-weight: 600;">${ch.name}</span>
                        </div>
                    </div>
                    <div class="match-footer" style="justify-content: flex-end;">
                        <button class="watch-btn">รับชมช่องนี้ ▸</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // โหลดข้อมูลเริ่มต้น
        loadData();
    </script>
</body>
</html>
