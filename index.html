<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLTRA Live - iOS Style</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --card-hover: #2c2c2e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --accent-color: #0a84ff;
            --live-red: #ff453a;
            --border-color: #2c2c2e;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px 0; }
        header p { color: var(--text-secondary); font-size: 14px; margin: 0; }

        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .match-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .match-card:hover {
            background-color: var(--card-hover);
            transform: translateY(-2px);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .league-badge {
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .live-tag {
            background-color: rgba(255, 69, 58, 0.2);
            color: var(--live-red);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--live-red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .teams-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .team-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 500;
        }

        .team-row img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .match-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .watch-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .loading, .no-data {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
            font-size: 15px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <h1>Live Events</h1>
        <p>iOS Style Match Center</p>
    </header>

    <div id="matches-container" class="match-grid">
        <div class="loading">กำลังโหลดรายการสด...</div>
    </div>

    <script>
        async function loadEvents() {
            try {
                const response = await fetch('live_events.json');
                const events = await response.json();
                
                const container = document.getElementById('matches-container');
                container.innerHTML = '';

                if (events.length === 0) {
                    container.innerHTML = '<div class="no-data">ไม่พบรายการแข่งขันสดในขณะนี้</div>';
                    return;
                }

                events.forEach(ev => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    // เปิดลิงก์ตรงในแท็บใหม่ทันที เพื่อให้ Player ทำงานได้ปกติไม่โดนบล็อก
                    card.onclick = () => {
                        if (ev.stream_url) {
                            window.open(ev.stream_url, '_blank');
                        } else {
                            alert('ไม่พบลิงก์สตรีมสำหรับรายการนี้');
                        }
                    };

                    card.innerHTML = `
                        <div>
                            <div class="match-header">
                                <span class="league-badge" title="${ev.league || ev.category}">${ev.league || ev.category}</span>
                                <div class="live-tag">
                                    <div class="live-dot"></div> LIVE
                                </div>
                            </div>
                            <div class="teams-container">
                                <div class="team-row">
                                    <img src="${ev.home_logo || ''}" onerror="this.style.display='none'">
                                    <span>${ev.home}</span>
                                </div>
                                <div class="team-row">
                                    <img src="${ev.away_logo || ''}" onerror="this.style.display='none'">
                                    <span>${ev.away}</span>
                                </div>
                            </div>
                        </div>
                        <div class="match-footer">
                            <span>🕒 ${ev.time_display || ev.time_utc || ''}</span>
                            <button class="watch-btn">รับชม ▸</button>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Error loading JSON:', error);
                document.getElementById('matches-container').innerHTML = 
                    '<div class="no-data">ไม่พบไฟล์ live_events.json กรุณารันสคริปต์ Python ก่อน</div>';
            }
        }

        loadEvents();
    </script>
</body>
</html>
