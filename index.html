<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATMFlix Live Events + Fixtures</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <img src="https://kicksball.com/assets/img/logo.png" alt="logo">
  <h1>ATMFlix Live Events + Fixtures</h1>
  <p id="datetime">กำลังโหลด...</p>
</header>

<div class="toolbar">
  <div class="status" id="status">🌐 กำลังเชื่อมต่อ API...</div>

  <input type="date" id="datePicker" class="date-picker">

  <select id="groupSelect" class="group-select">
    <option value="">-- ทั้งหมด --</option>
  </select>

  <input type="text" id="search" class="search-box" placeholder="🔍 ค้นหา...">

  <div>
    <button class="btn btn-primary" id="reloadBtn">🔄 โหลดใหม่</button>
    <button class="btn btn-success" id="downloadBtn" disabled>⬇️ ดาวน์โหลด .w3u</button>
  </div>
</div>

<div id="content">
  <div class="loader">
    <div class="spinner"></div>
    กำลังดึงข้อมูล...
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
